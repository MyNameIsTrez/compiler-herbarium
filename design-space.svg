<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 770" width="1270" height="770" role="img" aria-labelledby="t d">
<title id="t">The design space of the compilers and interpreters in compiler-herbarium</title>
<desc id="d">A map of every entry. The horizontal axis is what sits between the source and execution, from nothing to tree, bytecode, SSA, graph, functional term, relations and a search over candidate programs. The vertical axis is how the program is run: interpreted, compiled ahead of time, compiled while running (JIT), or only analyzed. Blue filled dots are finished distilled entries, dashed hollow dots are planned ones, and amber diamonds are original entries, and thin lines join related designs.</desc>
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#656d76;--grid:#d0d7de;--acc:#0969da;--band:#f6f8fa;--org:#bf8700}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--grid:#30363d;--acc:#58a6ff;--band:#161b22;--org:#d29922}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.h{font-size:12px;font-weight:600;text-anchor:middle}
.rh{font-size:12px;font-weight:600}
.ax{font-size:11px;fill:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.n{font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.p{font-style:italic;fill:var(--mut)}
.l{stroke:var(--mut);stroke-width:1;stroke-dasharray:2 3;opacity:.8}
.dn{fill:var(--acc)}
.or{fill:var(--org)}
.rb{fill:none;stroke:var(--mut);stroke-width:1}
.x{stroke:var(--mut);stroke-width:1.2;opacity:.6}
.pl{fill:var(--bg);stroke:var(--acc);stroke-width:1.6;stroke-dasharray:3 2}
.bg{fill:var(--bg)}
.band{fill:var(--band)}
.g{stroke:var(--grid);stroke-width:1}
</style>
<rect class="bg" width="1270" height="770"/>
<text class="ax" x="705" y="16" text-anchor="middle">What sits between the source and execution</text>
<rect class="band" x="10" y="80" width="1250" height="150"/>
<text class="rh" x="18" y="152">Interprets</text><text class="rh" x="18" y="169">(no machine code)</text>
<text class="rh" x="18" y="302">Compiles ahead</text><text class="rh" x="18" y="319">of time</text>
<rect class="band" x="10" y="380" width="1250" height="150"/>
<text class="rh" x="18" y="452">Compiles while</text><text class="rh" x="18" y="469">running (JIT)</text>
<text class="rh" x="18" y="602">Analysis only</text><text class="rh" x="18" y="619">(no program out)</text>
<text class="h" x="220" y="42">Nothing in</text>
<text class="h" x="220" y="58">between</text>
<text class="h" x="360" y="42">Tree</text>
<text class="h" x="360" y="58">(AST)</text>
<text class="h" x="500" y="42">Bytecode</text>
<text class="h" x="640" y="42">SSA CFG</text>
<text class="h" x="640" y="58">or trace</text>
<text class="h" x="780" y="42">Graph</text>
<text class="h" x="780" y="58">(nodes, e-classes)</text>
<text class="h" x="920" y="42">Functional term</text>
<text class="h" x="920" y="58">(ANF, CPS, STG)</text>
<text class="h" x="1060" y="42">Facts, relations,</text>
<text class="h" x="1060" y="58">schedules</text>
<text class="h" x="1200" y="42">Search over</text>
<text class="h" x="1200" y="58">candidate programs</text>
