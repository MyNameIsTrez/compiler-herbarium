name: ci

on:
  push:
  pull_request:

jobs:
  tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the README and RESEARCH tables are sorted
        run: scripts/check-sorted.sh
      - name: Check that the design space map lists every entry
        run: scripts/check-map.sh
      - name: Install the oracles (Lua and SQLite)
        run: sudo apt-get install -y lua5.4 sqlite3
      - name: Check that every expected.txt is reproduced by its oracle
        run: scripts/check-expected.sh

  discover:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.find.outputs.entries }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          entries=$(find distilled original -mindepth 2 -maxdepth 2 -name main.c -printf '%h\n' 2>/dev/null | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "entries=${entries:-[]}" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    if: needs.discover.outputs.entries != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.entries) }}
        cc: [gcc, clang]
        opt: ["-O2"]
    steps:
      - uses: actions/checkout@v7
      - name: Build, run and check ${{ matrix.entry }} with ${{ matrix.cc }} at ${{ matrix.opt }}
        run: scripts/check-entry.sh "${{ matrix.entry }}"
        env:
          CC: ${{ matrix.cc }}
          OPT: ${{ matrix.opt }}
      - name: Build ${{ matrix.entry }} the plain way, as the README says
        run: ${{ matrix.cc }} "${{ matrix.entry }}/main.c" -o "$RUNNER_TEMP/plain"
      - name: Check that the stages in main.c and FIDELITY.md agree
        if: startsWith(matrix.entry, 'distilled/') && matrix.cc == 'gcc'
        run: scripts/check-fidelity.sh "${{ matrix.entry }}"

  coverage:
    needs: discover
    if: needs.discover.outputs.entries != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.entries) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install gcovr
        run: pipx install gcovr==8.8
      - name: Require 100% line and branch coverage for ${{ matrix.entry }}
        run: scripts/coverage-entry.sh "${{ matrix.entry }}"
